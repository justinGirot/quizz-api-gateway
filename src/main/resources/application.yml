server:
  port: 8080

spring:
  application:
    name: api-gateway

# CORS Configuration
# Configure allowed origins for cross-origin requests
cors:
  # Use allowedOriginPatterns for development (supports wildcards)
  # This allows any port on localhost (e.g., :5173, :5174, :3000)
  allowed-origin-patterns:
    - "http://localhost:[*]"
    - "http://127.0.0.1:[*]"

  # Use allowedOrigins for production (exact matches only)
  # Uncomment and specify exact origins in production
  # allowed-origins:
  #   - "https://app.example.com"
  #   - "https://www.example.com"

  # Allow credentials (cookies, authorization headers)
  allow-credentials: true

  # Cache preflight requests for 1 hour (in seconds)
  max-age: 3600

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.quizz.apigateway: INFO
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO
